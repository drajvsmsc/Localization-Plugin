<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
  
  <!-- Globe icon -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Latitude lines -->
  <ellipse cx="64" cy="64" rx="35" ry="15" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <ellipse cx="64" cy="64" rx="35" ry="25" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  
  <!-- Longitude line -->
  <ellipse cx="64" cy="64" rx="15" ry="35" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  
  <!-- Check mark overlay -->
  <path d="M 45 64 L 58 77 L 83 52" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter indicators -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" opacity="0.9">A</text>
  <text x="80" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" opacity="0.9">字</text>
</svg>

